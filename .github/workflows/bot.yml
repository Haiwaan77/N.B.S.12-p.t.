name: NSE Option Chain Paper Trading Bot

on:
  schedule:
    - cron: '*/5 3-9 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pytz requests nsepython
      - name: Run bot
        run: python paper_trading.py
