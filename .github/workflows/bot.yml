name: Angel One Paper Trading Bot

on:
  schedule:
    - cron: '*/5 3-9 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pandas numpy pytz requests logzero pyotp yfinance websocket-client
      - name: Run bot
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python paper_trading.py
      - name: Generate Report
        run: python report.py
      - name: Commit and push report and trades
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add report.html trades.json open_positions.json
          git commit -m "Update report and trade history" || echo "No changes to commit"
          git push
